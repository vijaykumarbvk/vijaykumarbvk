<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="100%" height="140">
  <defs>
    <!-- The Ultra-Premium Cyber-Aurora Flowing Gradient -->
    <linearGradient id="flow" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="25%" stop-color="#4FACFE" />
      <stop offset="50%" stop-color="#9B51E0" />
      <stop offset="75%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00F2FE" />
      <animate attributeName="x1" values="0%;-100%" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%;100%" dur="6s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <!-- Inline styling makes it immune to GitHub's proxy stripping -->
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" letter-spacing="-1px" fill="url(#flow)">Hi there, I'm Vijaykumar 👋</text>
</svg>
